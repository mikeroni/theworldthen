<style>
  :root{
    --void:#0d0a14;--void-2:#15111f;--ink:#efe9f0;--ink-dim:#9a90a8;--ink-faint:#8a7f9e;
    --cyan:#7fe6d8;--magenta:#e07fb0;--line:#322b4a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--void) 0%,var(--void-2) 100%) var(--void);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  main{padding:32px;max-width:520px}
  .dipper{margin:0 auto 28px;display:block;opacity:.9}
  .brand{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:20px;
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:34px}
  .brand .bx{color:var(--ink-faint)} .brand b{color:var(--cyan);font-weight:700}
  h1{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;
    font-size:64px;letter-spacing:-1px;line-height:1.05;margin-bottom:14px}
  .yr{color:var(--ink-dim);font-size:15px;line-height:1.65;margin-bottom:30px}
  a.go{display:inline-block;padding:11px 22px;border:1px solid var(--line);
    border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px}
  a.go:hover{border-color:var(--cyan);color:var(--cyan)}
  a.sub{display:inline-block;margin-top:16px;color:var(--ink-faint);font-size:13px}
  a.sub:hover{color:var(--ink-dim)}
</style>

  <a class="sub" href="/about.html">About the project</a>
